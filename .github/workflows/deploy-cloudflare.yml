name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Credentials (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   cfut_/cfat_/legacy token  ← preferred (cfk_ = global key)
#   CLOUDFLARE_ACCOUNT_ID  account ID (required)
#   CLOUDFLARE_EMAIL       only for the global-key path (cfk_)
#
# Optional repository *variable*: WORKERS_SUBDOMAIN — the *.workers.dev name to
# register when the account does not have one yet.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build if the Worker entry/assets no longer bundle.
      - name: Typecheck Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Check deploy credentials
        id: creds
        env:
          API_KEY_OR_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          cred=$(printf '%s' "${API_KEY_OR_TOKEN:-}" | tr -d '[:space:]')
          email=$(printf '%s' "${EMAIL:-}" | tr -d '[:space:]')
          acct=$(printf '%s' "${ACCOUNT_ID:-}" | tr -d '[:space:]')

          echo "account=$acct" >> "$GITHUB_OUTPUT"

          if [ -z "$cred" ] || [ -z "$acct" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::credential shape: prefix='${cred:0:4}' length=$(printf '%s' "$cred" | wc -c) (cfut_/cfat_ scoped token, cfk_ global key); account id length=$(printf '%s' "$acct" | wc -c)"

          case "$cred" in
            cfk_*)
              if [ -n "$email" ]; then
                echo "mode=key" >> "$GITHUB_OUTPUT"
                echo "::notice::Using Cloudflare Global API Key + $email (consider a scoped cfut_ token instead)."
              else
                echo "::warning::CLOUDFLARE_API_TOKEN starts with cfk_, a Global API Key rather than an API token. It cannot be used as a Bearer token (Cloudflare answers 'Invalid API Token'). Add CLOUDFLARE_EMAIL to use the key, or create a scoped API token (cfut_…) from the 'Edit Cloudflare Workers' template. Skipping deploy."
                echo "mode=none" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "mode=token" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Verify Cloudflare credentials
        if: steps.creds.outputs.mode != 'none'
        env:
          MODE: ${{ steps.creds.outputs.mode }}
          ACCOUNT_ID: ${{ steps.creds.outputs.account }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set +e
          base=https://api.cloudflare.com/client/v4

          if [ "$MODE" = "key" ]; then
            body=$(curl -sS --max-time 20 -H "X-Auth-Key: $TOKEN" -H "X-Auth-Email: $EMAIL" "$base/user")
            kind="global API key"
          else
            case "$TOKEN" in
              cfat_*) url="$base/accounts/$ACCOUNT_ID/tokens/verify"; kind="account token" ;;
              *)      url="$base/user/tokens/verify";              kind="user token" ;;
            esac
            body=$(curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" "$url")
          fi

          if printf '%s' "$body" | grep -q '"success":true'; then
            echo "::notice::$kind accepted by Cloudflare."
          else
            echo "::error::Cloudflare rejected the $kind: $(printf '%s' "$body" | tr -d '\n' | cut -c1-500)"
          fi

      # Cloudflare answers 10007 until the account owns a *.workers.dev subdomain.
      # Register one automatically; the name can be pinned with vars.WORKERS_SUBDOMAIN.
      - name: Ensure workers.dev subdomain
        id: sub
        if: steps.creds.outputs.mode != 'none'
        env:
          ACCOUNT_ID: ${{ steps.creds.outputs.account }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          MODE: ${{ steps.creds.outputs.mode }}
          PREFERRED: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          set +e
          base=https://api.cloudflare.com/client/v4
          if [ "$MODE" = "key" ]; then
            auth=(-H "X-Auth-Key: $TOKEN" -H "X-Auth-Email: $EMAIL")
          else
            auth=(-H "Authorization: Bearer $TOKEN")
          fi

          read_sub() {
            curl -sS --max-time 20 "${auth[@]}" "$base/accounts/$ACCOUNT_ID/workers/subdomain" \
              | sed -n 's/.*"subdomain":"\([^"]*\)".*/\1/p'
          }

          sub=$(read_sub)
          if [ -n "$sub" ]; then
            echo "::notice::workers.dev subdomain already registered: $sub.workers.dev"
            echo "subdomain=$sub" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          candidate="${PREFERRED:-jitben-$(printf '%s' "$ACCOUNT_ID" | cut -c1-6)}"
          candidate=$(printf '%s' "$candidate" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')
          for attempt in 1 2 3; do
            out=$(curl -sS --max-time 20 -X PUT "${auth[@]}" -H 'content-type: application/json' \
              --data "{\"subdomain\":\"$candidate\"}" "$base/accounts/$ACCOUNT_ID/workers/subdomain")
            if printf '%s' "$out" | grep -q '"success":true'; then
              echo "::notice::Registered workers.dev subdomain: $candidate.workers.dev"
              echo "subdomain=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 10036 = "Account already has an associated subdomain" — read it back.
            if printf '%s' "$out" | grep -q '10036'; then
              sub=$(read_sub)
              if [ -n "$sub" ]; then
                echo "::notice::workers.dev subdomain already registered: $sub.workers.dev"
                echo "subdomain=$sub" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            candidate="$candidate$((attempt + 1))"
          done
          echo "::error::Could not determine or register a workers.dev subdomain: $(printf '%s' "$out" | tr -d '\n' | cut -c1-400)"

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.mode != 'none'
        env:
          MODE: ${{ steps.creds.outputs.mode }}
          ACCOUNT_ID: ${{ steps.creds.outputs.account }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          SUBDOMAIN: ${{ steps.sub.outputs.subdomain }}
        run: |
          set +e
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          if [ "$MODE" = "key" ]; then
            export CLOUDFLARE_API_KEY="$TOKEN" CLOUDFLARE_EMAIL="$EMAIL"
            unset CLOUDFLARE_API_TOKEN
          else
            export CLOUDFLARE_API_TOKEN="$TOKEN"
          fi

          npx wrangler deploy 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          plain=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log)

          worker=$(sed -n 's/.*"name": *"\([^"]*\)".*/\1/p' wrangler.jsonc | head -n 1)
          url=$(printf '%s' "$plain" | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' | tail -n 1)
          if [ -z "$url" ] && [ -n "$SUBDOMAIN" ] && [ -n "$worker" ]; then
            url="https://$worker.$SUBDOMAIN.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::wrangler deploy failed (exit $status): $(printf '%s' "$plain" | grep -iE 'error|invalid|unauthor|forbidden|denied|not found|code:' | tail -n 4 | tr '\n' ' ' | cut -c1-800)"
            exit "$status"
          fi
          echo "::notice::Deployed $worker to ${url:-an unknown URL}"

      - name: Smoke test /api/health
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Checking $URL/api/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 "$URL/api/health")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && head -c 400 body.txt; then
              echo; exit 0
            fi
            sleep 15
          done
          echo "::error::$URL/api/health answered HTTP $code: $(head -c 300 body.txt | tr -d '\n')"
          exit 1
