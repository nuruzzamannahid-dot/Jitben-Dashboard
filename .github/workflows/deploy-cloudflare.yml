name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Credential options (GitHub → Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   scoped token (cfut_/cfat_/legacy 40-char)  ← preferred
#   CLOUDFLARE_ACCOUNT_ID  account ID (required in every case)
#   CLOUDFLARE_EMAIL       only for the global API key path (cfk_)
#
# A cfk_-prefixed value is a *Global API Key*, not a token: it authenticates
# with X-Auth-Key + X-Auth-Email and is rejected by the Bearer-token path.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build if the Worker entry/assets no longer bundle.
      - name: Typecheck Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Check deploy credentials
        id: creds
        env:
          API_KEY_OR_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          cred=$(printf '%s' "${API_KEY_OR_TOKEN:-}" | tr -d '[:space:]')
          email=$(printf '%s' "${EMAIL:-}" | tr -d '[:space:]')
          acct=$(printf '%s' "${ACCOUNT_ID:-}" | tr -d '[:space:]')

          echo "account=$acct" >> "$GITHUB_OUTPUT"

          if [ -z "$cred" ] || [ -z "$acct" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Shape only — never the value. Distinguishes paste errors from account issues.
          echo "::notice::credential shape: prefix='${cred:0:4}' length=$(printf '%s' "$cred" | wc -c) (cfut_/cfat_ scoped token, cfk_ global key); account id length=$(printf '%s' "$acct" | wc -c)"

          case "$cred" in
            cfk_*)
              # Global API Key → needs the account email for X-Auth-Key auth.
              if [ -n "$email" ]; then
                echo "mode=key" >> "$GITHUB_OUTPUT"
                echo "::notice::Using Cloudflare Global API Key + $email (consider a scoped cfut_ token instead)."
              else
                echo "::warning::CLOUDFLARE_API_TOKEN starts with cfk_, which is a Global API Key, not an API token. It cannot be used as a Bearer token (Cloudflare answers 'Invalid API Token'). Add CLOUDFLARE_EMAIL to use the key, or create a scoped API token (cfut_…) from the 'Edit Cloudflare Workers' template. Skipping deploy."
                echo "mode=none" >> "$GITHUB_OUTPUT"
              fi
              ;;
            cfut_*|cfat_*|*)
              echo "mode=token" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Verify Cloudflare credentials
        if: steps.creds.outputs.mode != 'none'
        id: verify
        env:
          MODE: ${{ steps.creds.outputs.mode }}
          ACCOUNT_ID: ${{ steps.creds.outputs.account }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set +e
          base=https://api.cloudflare.com/client/v4

          if [ "$MODE" = "key" ]; then
            body=$(curl -sS --max-time 20 -H "X-Auth-Key: $TOKEN" -H "X-Auth-Email: $EMAIL" "$base/user")
            kind="global API key"
          else
            case "$TOKEN" in
              cfat_*) url="$base/accounts/$ACCOUNT_ID/tokens/verify"; kind="account token" ;;
              *)      url="$base/user/tokens/verify";              kind="user token" ;;
            esac
            body=$(curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" "$url")
          fi
          echo "verify ($kind): $body"
          if printf '%s' "$body" | grep -q '"success":true'; then
            echo "::notice::$kind accepted by Cloudflare."
          else
            echo "::error::Cloudflare rejected the $kind: $(printf '%s' "$body" | tr -d '\n' | cut -c1-500)"
          fi

          # Does this account have a workers.dev subdomain? wrangler refuses to
          # publish a workers.dev service without one.
          resp=$(curl -sS --max-time 20 -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "$base/accounts/$ACCOUNT_ID/workers/subdomain")
          code=$(printf '%s' "$resp" | tail -n 1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "subdomain check HTTP $code: $body"
          sub=$(printf '%s' "$body" | sed -n 's/.*"subdomain":"\([^"]*\)".*/\1/p')
          if [ "$code" = "200" ] && [ -n "$sub" ]; then
            echo "::notice::workers.dev subdomain: $sub.workers.dev"
          elif [ "$code" = "200" ]; then
            echo "::error::This account has no workers.dev subdomain yet. Register one at https://dash.cloudflare.com/$ACCOUNT_ID/workers/onboarding (or add a route to wrangler.jsonc and set \"workers_dev\": false)."
          else
            echo "::error::Cannot read the account's workers.dev subdomain (HTTP $code): $(printf '%s' "$body" | tr -d '\n' | cut -c1-400) — the token likely lacks Account Settings: Read / Workers Scripts: Edit."
          fi

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.mode != 'none'
        env:
          MODE: ${{ steps.creds.outputs.mode }}
          ACCOUNT_ID: ${{ steps.creds.outputs.account }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set +e
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          if [ "$MODE" = "key" ]; then
            export CLOUDFLARE_API_KEY="$TOKEN" CLOUDFLARE_EMAIL="$EMAIL"
            unset CLOUDFLARE_API_TOKEN
          else
            export CLOUDFLARE_API_TOKEN="$TOKEN"
          fi

          npx wrangler deploy 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          url=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            plain=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log)
            if printf '%s' "$plain" | grep -qi 'workers.dev subdomain'; then
              echo "::error::Account $ACCOUNT_ID has no workers.dev subdomain registered. Either register one (Dash → Workers & Pages → your account → 'Subdomain'), or add a route/custom domain to wrangler.jsonc and set \"workers_dev\": false."
            fi
            msg=$(printf '%s' "$plain" \
              | grep -iE 'error|invalid|unauthor|forbidden|denied|not found|code:' \
              | tail -n 4 | tr '\n' ' ' | cut -c1-800)
            echo "::error::wrangler deploy failed (exit $status): ${msg:-see the deploy log}"
            exit "$status"
          fi

      - name: Smoke test /api/health
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Deployment: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$URL/api/health"; then
              echo; exit 0
            fi
            echo "attempt $i failed, retrying in 10s…"
            sleep 10
          done
          echo "::error::/api/health did not respond after deploy"
          exit 1
