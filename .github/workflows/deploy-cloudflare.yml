name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build if the Worker entry/assets no longer bundle.
      - name: Typecheck Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

      # Without these secrets the run says so instead of dying inside wrangler.
      - name: Check deploy credentials
        id: creds
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Surfaces token/account problems as annotations we can read without logs.
      - name: Verify Cloudflare credentials
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          body=$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "token verify response: $body"
          ok=$(printf '%s' "$body" | grep -c '"success":true')
          if [ "$ok" -eq 0 ]; then
            echo "::error::Token verify failed: $(printf '%s' "$body" | tr -d '\n' | cut -c1-600)"
          else
            echo "::notice::Token is active: $(printf '%s' "$body" | tr -d '\n' | cut -c1-200)"
          fi

          acct=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "account scripts HTTP $acct"
          if [ "$acct" != "200" ]; then
            echo "::error::Account $CLOUDFLARE_ACCOUNT_ID is not accessible with this token (HTTP $acct) — check the account ID and the token's Workers Scripts: Edit permission."
          fi

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            msg=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log \
              | grep -iE 'error|invalid|unauthor|forbidden|denied|not found|code:' \
              | tail -n 4 | tr '\n' ' ' | cut -c1-800)
            echo "::error::wrangler deploy failed (exit $status): ${msg:-see deploy.log}"
            exit "$status"
          fi

      - name: Smoke test /api/health
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Deployment: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$URL/api/health"; then
              echo; exit 0
            fi
            echo "attempt $i failed, retrying in 10s…"
            sleep 10
          done
          echo "::error::/api/health did not respond after deploy"
          exit 1
